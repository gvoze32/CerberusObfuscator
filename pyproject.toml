[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-obfuscator"
version = "4.0.0"
description = "Authenticated Python payload packer with optional runtime secret separation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "ISC"}
authors = [{name = "gvoze32"}]
dependencies = [
  "pycryptodome>=3.23.0",
]

[project.optional-dependencies]
binary = [
  "nuitka>=2.0.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.5",
  "mypy>=1.11",
]

[project.scripts]
cerberus = "cerberus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cerberus*"]
